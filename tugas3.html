<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            width: 500px;
            max-width:600px ;
            margin: 0 auto;
            border-radius: 20px;
            background: white;
            padding: 35px ;
        }
        h2 {
            text-align: center;
            color:palevioletred;
            margin-bottom: 30px;
        }
        label {
            display:block;
            margin-top: 15px;
            margin-bottom: 5px;
            color:deeppink;
            font-weight: bold;
        }
        input[type="number"]{
            width: 80%;
            font-size: 14px;
            border: 1px solid;
            padding: 8px;
            display: block;
            text-align: center;
            margin: 0 auto 20px auto;
        }
        input[type="text"]{
            font-weight: bold;
            
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: center;
        }
        .buttons button {
            padding: 6px 20px;
            font-size: 16px;

        }
        #output{
            background-color:palevioletred;
            width: 40%;
            margin: 0 auto;
            text-align: center;
            font-size: 20px;
            display: block;
            border: none;
            color: black;
        }
        label[for="output"] {
            display: block;
            text-align: center;
        }
        .kalkulator button {
            cursor: pointer;
            width: 50px;
            border-radius: 6px;
            font-size: 20px;
            border: none;
        }
        .tambah {
            background-color: palevioletred;
            color: white;
        }
        .kurang {
            background-color: palevioletred;
            color: white;
        } 
        .kali {
            background-color: palevioletred;
            color: white;
        }
        .bagi {
            background-color: palevioletred;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">

        <h2>Kalkulator</h2>
        
        <label for="angka1">Input Bilangan 1</label>
        <input type="number" id="angka1" placeholder="Masukkan Bilangan Pertama">

        <label for="angka2">Input Bilangan 2</label>
        <input type="number" id="angka2" placeholder="Masukkan Bilangan Kedua">
    
    <div class="buttons">
        <button class="tambah" onclick="hitung('+')">+</button>
        <button class="kurang" onclick="hitung('-')">-</button>
        <button class="kali" onclick="hitung('*')">x</button>
        <button class="bagi" onclick="hitung('/')">/</button>
    </div>
    <label for="output">Output</label>
    <input type="text" id="output" placeholder="Hasil">
    </div>

    <script>
        function hitung(operator) {
            let bilangan1 =
            parseFloat(document.getElementById("angka1").value);
            let bilangan2 =
            parseFloat(document.getElementById("angka2").value);
            let hasil;
        
        if (isNaN(bilangan1) || isNaN(bilangan2)){
            document.getElementByld("output").value = "Masukkan Kedua Bilangan";
            return;
        } 
        switch (operator) {
            case '+':
            hasil = bilangan1 + bilangan2;
            break;
            case '-':
            hasil = bilangan1 - bilangan2;
            break;
            case '*':
            hasil = bilangan1 * bilangan2;
            break;
            case '/':
              if(bilangan2 === 0){
                document.getElementById("output").value = "Tidak bisa dibagi 0";
                return;
              }
            hasil = bilangan1/bilangan2;
            break;
        }   
        document.getElementById("output").value = hasil;
        }
    </script>


</body>
</html>
